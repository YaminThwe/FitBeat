<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fitbeat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a7a" />
      <stop offset="50%" stop-color="#db1b78" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#fitbeat-grad)" />
  
  <!-- Waveform audio bars centered within 80% safe zone -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="136" y="210" width="32" height="92" rx="16" />
    <!-- Bar 2 -->
    <rect x="192" y="150" width="32" height="212" rx="16" />
    <!-- Bar 3 (Center) -->
    <rect x="248" y="120" width="32" height="272" rx="16" />
    <!-- Bar 4 -->
    <rect x="304" y="170" width="32" height="172" rx="16" />
    <!-- Bar 5 -->
    <rect x="360" y="226" width="32" height="60" rx="16" />
  </g>
</svg>
